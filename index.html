<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing 웹캠 아트</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.js"></script>
    
    <script src="sketch.js"></script>
    
    <style>
        body {
            margin: 0;
            /* Flexbox를 사용하여 캔버스를 화면 중앙으로 정렬합니다. */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #222; /* 주변 여백 색상 */
        }
        canvas {
            display: block;
            border: 1px solid #555;
            
            /* 캔버스가 뷰포트 크기를 초과하지 않도록 제한 */
            max-width: 100vw;
            max-height: 100vh;
            
            /* 핵심: 비율을 유지하며 최대 크기로 조정 */
            object-fit: contain; 
            
            /* 브라우저가 크기를 조절할 수 있도록 설정 */
            width: auto; 
            height: auto;
        }
    </style>
</head>
<body>
</body>
</html>
